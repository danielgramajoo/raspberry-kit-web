<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Raspberry Pi IoT</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  color: #222;
}

header {
  background: #111827;
  color: white;
  text-align: center;
  padding: 25px 15px;
}

header h1 {
  margin: 0;
}

header p {
  margin-bottom: 0;
}

.contenedor {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(250px, 1fr)
    );

  gap: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 25px;

  box-shadow:
    0 5px 18px
    rgba(0,0,0,0.08);
}

.card h2 {
  margin-top: 0;
}

.valor {
  font-size: 40px;
  font-weight: bold;
  margin: 20px 0;
}

.unidad {
  font-size: 20px;
  font-weight: normal;
}

.estado {
  font-weight: bold;
}

.conectado {
  color: #16a34a;
}

.error {
  color: #dc2626;
}

.encendido {
  color: #16a34a;
}

.apagado {
  color: #6b7280;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 14px 20px;
  font-size: 16px;
  cursor: pointer;
  margin-right: 8px;
}

.encender {
  background: #22c55e;
  color: white;
}

.apagar {
  background: #ef4444;
  color: white;
}

.enviar {
  width: 100%;
  background: #2563eb;
  color: white;
  margin-top: 12px;
}

input {
  width: 100%;
  padding: 14px;

  border:
    1px solid #d1d5db;

  border-radius: 10px;

  font-size: 16px;
}

.mensaje {
  margin-top: 15px;
  background: #f3f4f6;
  border-radius: 10px;
  padding: 12px;
}

footer {
  text-align: center;
  color: #6b7280;
  padding: 30px;
}

</style>

</head>


<body>

<header>

<h1>Raspberry Pi IoT</h1>

<p>
Monitoreo y control en tiempo real
</p>

</header>


<div class="contenedor">

<div class="grid">


<!-- LUZ -->

<div class="card">

<h2>Luz</h2>

<div class="valor">

<span id="luz">--</span>

<span class="unidad">
lux
</span>

</div>

<p>

BH1750:

<span
  id="estadoBh"
  class="estado"
>
Cargando...
</span>

</p>

</div>


<!-- TEMPERATURA -->

<div class="card">

<h2>Temperatura</h2>

<div class="valor">

<span id="temperatura">
--
</span>

<span class="unidad">
°C
</span>

</div>

<p>

Sensor:

<span
  id="estadoAht"
  class="estado"
>
Cargando...
</span>

</p>

</div>


<!-- HUMEDAD -->

<div class="card">

<h2>Humedad</h2>

<div class="valor">

<span id="humedad">
--
</span>

<span class="unidad">
%
</span>

</div>

<p>
Humedad relativa del ambiente
</p>

</div>


<!-- LED -->

<div class="card">

<h2>Control LED</h2>

<p>

Estado:

<span
  id="estadoLed"
  class="estado"
>
Cargando...
</span>

</p>

<button
  class="encender"
  onclick="encenderLed()"
>
ENCENDER
</button>

<button
  class="apagar"
  onclick="apagarLed()"
>
APAGAR
</button>

</div>


<!-- OLED -->

<div class="card">

<h2>Pantalla OLED</h2>

<input
  id="textoOLED"
  type="text"
  maxlength="40"
  placeholder="Escribí un mensaje"
/>

<button
  class="enviar"
  onclick="enviarOLED()"
>
ENVIAR A OLED
</button>

<div class="mensaje">

Mensaje actual:

<br>

<strong id="mensajeActual">
--
</strong>

</div>

</div>


</div>

</div>


<footer>

Raspberry Pi 3 + Firebase + GitHub Pages

</footer>


<script type="module">

import {
  initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getDatabase,
  ref,
  set,
  onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  databaseURL:
  "https://raspberry-iot-d9350-default-rtdb.firebaseio.com/"

};


const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);


// ===========================
// REFERENCIAS
// ===========================

const luzRef =
  ref(db, "sensores/luz");

const temperaturaRef =
  ref(db, "sensores/temperatura");

const humedadRef =
  ref(db, "sensores/humedad");

const bhRef =
  ref(db, "sensores/bh1750");

const ahtRef =
  ref(db, "sensores/aht20");

const ledRef =
  ref(db, "actuadores/led");

const oledRef =
  ref(db, "pantalla/mensaje");


// ===========================
// LUZ
// ===========================

onValue(
  luzRef,
  snapshot => {

    document
      .getElementById("luz")
      .textContent =
      snapshot.val() ?? "--";

  }
);


// ===========================
// TEMPERATURA
// ===========================

onValue(
  temperaturaRef,
  snapshot => {

    document
      .getElementById("temperatura")
      .textContent =
      snapshot.val() ?? "--";

  }
);


// ===========================
// HUMEDAD
// ===========================

onValue(
  humedadRef,
  snapshot => {

    document
      .getElementById("humedad")
      .textContent =
      snapshot.val() ?? "--";

  }
);


// ===========================
// ESTADO BH1750
// ===========================

onValue(
  bhRef,
  snapshot => {

    const valor =
      snapshot.val();

    const elemento =
      document.getElementById(
        "estadoBh"
      );

    if (
      valor === "CONECTADO"
    ) {

      elemento.textContent =
        "CONECTADO";

      elemento.className =
        "estado conectado";

    }

    else {

      elemento.textContent =
        "ERROR";

      elemento.className =
        "estado error";

    }

  }
);


// ===========================
// ESTADO SENSOR TEMP/HUM
// ===========================

onValue(
  ahtRef,
  snapshot => {

    const valor =
      snapshot.val();

    const elemento =
      document.getElementById(
        "estadoAht"
      );

    if (
      valor === "CONECTADO"
    ) {

      elemento.textContent =
        "CONECTADO";

      elemento.className =
        "estado conectado";

    }

    else {

      elemento.textContent =
        "ERROR";

      elemento.className =
        "estado error";

    }

  }
);


// ===========================
// LED
// ===========================

window.encenderLed =
function() {

  set(
    ledRef,
    true
  );

};


window.apagarLed =
function() {

  set(
    ledRef,
    false
  );

};


onValue(
  ledRef,
  snapshot => {

    const valor =
      snapshot.val();

    const elemento =
      document.getElementById(
        "estadoLed"
      );

    if (
      valor === true
    ) {

      elemento.textContent =
        "ENCENDIDO";

      elemento.className =
        "estado encendido";

    }

    else {

      elemento.textContent =
        "APAGADO";

      elemento.className =
        "estado apagado";

    }

  }
);


// ===========================
// OLED
// ===========================

window.enviarOLED =
function() {

  const input =
    document.getElementById(
      "textoOLED"
    );

  const texto =
    input.value.trim();

  if (
    texto === ""
  ) {

    alert(
      "Escribí un mensaje."
    );

    return;
  }

  set(
    oledRef,
    texto
  );

  input.value = "";

};


onValue(
  oledRef,
  snapshot => {

    document
      .getElementById(
        "mensajeActual"
      )
      .textContent =
      snapshot.val()
      ?? "Sin mensaje";

  }
);

</script>

</body>

</html>
